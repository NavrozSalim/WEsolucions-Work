# AU orders + tickets worker only — run on the AU orders VPS (e.g. 46.250.247.31).
# US counterpart: docker-compose.us-orders.prod.yml (-Q orders-us).
#
# Consumes Celery queue ``orders-au``:
#   - listings.fetch_au_store_tickets  (Lasoo + Reverb, Store.region=AU)
#   - listings.fetch_au_store_orders   (Lasoo + Reverb, Store.region=AU)
#
# UI/API stay on the main app server. This host only runs the hourly sync workers.
#
# Requirements:
# - Same backend image as main (build or pull BACKEND_IMAGE).
# - DATABASE_URL and REDIS_URL must reach the main stack.
# - On main firewall: allow this host to Postgres :5432 and Redis :6379.
#
# From saas-store-sync/:
#   docker compose -f docker-compose.au-orders.prod.yml --env-file .env.prod up -d

x-backend-image: &backend-image
  image: ${BACKEND_IMAGE:-saas-store-sync-backend}
  build:
    context: ./backend
    dockerfile: Dockerfile

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "4"

services:
  celery_worker_orders_au:
    <<: *backend-image
    command: >-
      celery -A core worker -l info
      -Q orders-au
      --concurrency=${CELERY_AU_ORDERS_CONCURRENCY:-2}
      --prefetch-multiplier=1
      --max-tasks-per-child=${CELERY_AU_ORDERS_MAX_TASKS_PER_CHILD:-50}
      -O fair
    init: true
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - USE_REDIS_CACHE=${USE_REDIS_CACHE:-1}
      - PG_CONN_MAX_AGE=${PG_CONN_MAX_AGE:-120}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DEBUG=False
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-0}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
    volumes:
      - catalog_media_au_orders:/app/media
    restart: always
    stop_grace_period: 60s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          memory: 512M

volumes:
  catalog_media_au_orders:
