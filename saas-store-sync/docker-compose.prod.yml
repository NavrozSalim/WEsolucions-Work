# Production — Nginx + Gunicorn, static frontend from ./frontend/dist
# Usage: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# Build frontend: cd frontend && VITE_API_URL=/api/v1 npm run build
#
# Optional registry deploy: set BACKEND_IMAGE=youruser/saas-store-sync-backend:tag
# then: docker compose ... pull && up -d (skip --build)
#
# Optional dedicated Postgres: set DATABASE_URL in `.env.prod` to
# postgres://USER:PASSWORD@HOST:5432/DBNAME (URL-encode special chars in USER/PASSWORD).
# When unset, compose defaults to the bundled `db` service (same as before).



x-backend-image: &backend-image
  image: ${BACKEND_IMAGE:-saas-store-sync-backend}
  build:
    context: ./backend
    dockerfile: Dockerfile

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "4"

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Remote workers (e.g. US heavy-us) connect via DATABASE_URL on the main host.
    # Restrict this host port to trusted scraper IPs in firewall/security groups.
    ports:
      - "${POSTGRES_PUBLISH_PORT:-5432}:5432"
    restart: always
    stop_grace_period: 60s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: always
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy allkeys-lru --tcp-keepalive 60 --requirepass "$$REDIS_PASSWORD"
        else
          exec redis-server --appendonly yes --appendfsync everysec --maxmemory 512mb --maxmemory-policy allkeys-lru --tcp-keepalive 60
        fi
    volumes:
      - redisdata:/data
    # When REDIS_PASSWORD is set, set REDIS_URL=redis://:PASSWORD@redis:6379/0 (URL-encode special chars in PASSWORD).
    # Remote workers: same URL with main host instead of `redis`.
    ports:
      - "6379:6379"
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 64M
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG; else redis-cli ping | grep -q PONG; fi',
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  backend:
    <<: *backend-image
    command: gunicorn core.wsgi:application -c config/gunicorn.conf.py
    init: true
    expose:
      - "8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - USE_REDIS_CACHE=${USE_REDIS_CACHE:-1}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DEBUG=False
      # Nginx terminates TLS; Gunicorn is HTTP-only. Default off so Docker /health/ is not 301.
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-0}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://${DOMAIN_NAME}}
      - FRONTEND_URL=${FRONTEND_URL:-https://${DOMAIN_NAME}}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - GUNICORN_TIMEOUT=${GUNICORN_TIMEOUT:-120}
      - GUNICORN_WORKERS=${GUNICORN_WORKERS:-3}
      - PG_CONN_MAX_AGE=${PG_CONN_MAX_AGE:-60}
      - CATALOG_ALLOW_INLINE_STORE_WIDE_SCRAPE=${CATALOG_ALLOW_INLINE_STORE_WIDE_SCRAPE:-}
      # Scraper proxies (Costco AU, HEB US routing/UI, generic fallbacks)
      - PROXY_URL=${PROXY_URL:-}
      - PROXY_URLS=${PROXY_URLS:-}
      - COSTCO_AU_PROXY_URL=${COSTCO_AU_PROXY_URL:-}
      - COSTCO_AU_PROXY_URLS=${COSTCO_AU_PROXY_URLS:-}
      - HEB_US_PROXY_URL=${HEB_US_PROXY_URL:-}
      - HEB_US_PROXY_URLS=${HEB_US_PROXY_URLS:-}
      - PROXY_ENDPOINTS=${PROXY_ENDPOINTS:-}
      - PROXY_HOST=${PROXY_HOST:-}
      - PROXY_PORT=${PROXY_PORT:-}
      - PROXY_USER=${PROXY_USER:-}
      - PROXY_PASS=${PROXY_PASS:-}
      - PROXY_SCHEME=${PROXY_SCHEME:-http}
    volumes:
      - catalog_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          memory: 512M
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; r=urllib.request.Request(\"http://127.0.0.1:8000/health/\", headers={\"Host\":\"backend\"}); urllib.request.urlopen(r, timeout=8)"',
        ]
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 90s

  nginx:
    image: nginx:alpine
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./backend/config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./backend/config/nginx-app-server.inc:/etc/nginx/nginx-app-server.inc:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    stop_grace_period: 15s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 32M
    # wget to / often gets 301 (HTTP→HTTPS); nginx -t validates config without HTTP.
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Split workers so ingest/sync/light never consume heavy-* queues (US/AU are remote).
  # Ingest: file ingest, catalog_sync, catalog_update. Sync: run_store_* (scrape + marketplace push).
  # Light: scrape chord finalizers, resume-after-stop, Beat check_scheduled_updates.
  # US: docker-compose.us-scraper.prod.yml (-Q heavy-us). AU: docker-compose.au-scraper.prod.yml (-Q heavy-au).
  celery_worker_celery:
    <<: *backend-image
    command: >-
      celery -A core worker -l info
      -Q celery
      --concurrency=${CELERY_CELERY_CONCURRENCY:-4}
      --prefetch-multiplier=1 -O fair
    init: true
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - PG_CONN_MAX_AGE=${PG_CONN_MAX_AGE:-60}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DEBUG=False
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-0}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://${DOMAIN_NAME}}
      - FRONTEND_URL=${FRONTEND_URL:-https://${DOMAIN_NAME}}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - CATALOG_ALLOW_INLINE_STORE_WIDE_SCRAPE=${CATALOG_ALLOW_INLINE_STORE_WIDE_SCRAPE:-}
      - EBAY_HTTP_FIRST=${EBAY_HTTP_FIRST:-0}
      - PROXY_URL=${PROXY_URL:-}
      - PROXY_URLS=${PROXY_URLS:-}
      - COSTCO_AU_PROXY_URL=${COSTCO_AU_PROXY_URL:-}
      - COSTCO_AU_PROXY_URLS=${COSTCO_AU_PROXY_URLS:-}
      - HEB_US_PROXY_URL=${HEB_US_PROXY_URL:-}
      - HEB_US_PROXY_URLS=${HEB_US_PROXY_URLS:-}
      - PROXY_ENDPOINTS=${PROXY_ENDPOINTS:-}
      - PROXY_HOST=${PROXY_HOST:-}
      - PROXY_PORT=${PROXY_PORT:-}
      - PROXY_USER=${PROXY_USER:-}
      - PROXY_PASS=${PROXY_PASS:-}
      - PROXY_SCHEME=${PROXY_SCHEME:-http}
      - COSTCO_AU_MIN_REQUEST_GAP_SEC=${COSTCO_AU_MIN_REQUEST_GAP_SEC:-20}
      - COSTCO_AU_LOCK_WAIT_SEC=${COSTCO_AU_LOCK_WAIT_SEC:-120}
    volumes:
      - catalog_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: always
    stop_grace_period: 60s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
        reservations:
          memory: 384M

  celery_worker_ingest:
    <<: *backend-image
    command: >-
      celery -A core worker -l info
      -Q ingest
      --concurrency=${CELERY_INGEST_CONCURRENCY:-3}
      --prefetch-multiplier=1 -O fair
    init: true
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - USE_REDIS_CACHE=${USE_REDIS_CACHE:-1}
      - PG_CONN_MAX_AGE=${PG_CONN_MAX_AGE:-60}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DEBUG=False
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-0}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://${DOMAIN_NAME}}
      - FRONTEND_URL=${FRONTEND_URL:-https://${DOMAIN_NAME}}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - CATALOG_ALLOW_INLINE_STORE_WIDE_SCRAPE=${CATALOG_ALLOW_INLINE_STORE_WIDE_SCRAPE:-}
      - EBAY_HTTP_FIRST=${EBAY_HTTP_FIRST:-0}
      - PROXY_URL=${PROXY_URL:-}
      - PROXY_URLS=${PROXY_URLS:-}
      - COSTCO_AU_PROXY_URL=${COSTCO_AU_PROXY_URL:-}
      - COSTCO_AU_PROXY_URLS=${COSTCO_AU_PROXY_URLS:-}
      - HEB_US_PROXY_URL=${HEB_US_PROXY_URL:-}
      - HEB_US_PROXY_URLS=${HEB_US_PROXY_URLS:-}
      - PROXY_ENDPOINTS=${PROXY_ENDPOINTS:-}
      - PROXY_HOST=${PROXY_HOST:-}
      - PROXY_PORT=${PROXY_PORT:-}
      - PROXY_USER=${PROXY_USER:-}
      - PROXY_PASS=${PROXY_PASS:-}
      - PROXY_SCHEME=${PROXY_SCHEME:-http}
      - COSTCO_AU_MIN_REQUEST_GAP_SEC=${COSTCO_AU_MIN_REQUEST_GAP_SEC:-20}
      - COSTCO_AU_LOCK_WAIT_SEC=${COSTCO_AU_LOCK_WAIT_SEC:-120}
    volumes:
      - catalog_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: always
    stop_grace_period: 60s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
        reservations:
          memory: 384M

  celery_worker_sync:
    <<: *backend-image
    command: >-
      celery -A core worker -l info
      -Q sync
      --concurrency=${CELERY_SYNC_CONCURRENCY:-2}
      --prefetch-multiplier=1 -O fair
    init: true
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - PG_CONN_MAX_AGE=${PG_CONN_MAX_AGE:-60}
      - USE_REDIS_CACHE=${USE_REDIS_CACHE:-1}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DEBUG=False
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-0}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://${DOMAIN_NAME}}
      - FRONTEND_URL=${FRONTEND_URL:-https://${DOMAIN_NAME}}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - CATALOG_ALLOW_INLINE_STORE_WIDE_SCRAPE=${CATALOG_ALLOW_INLINE_STORE_WIDE_SCRAPE:-}
      - EBAY_HTTP_FIRST=${EBAY_HTTP_FIRST:-0}
      - PROXY_URL=${PROXY_URL:-}
      - PROXY_URLS=${PROXY_URLS:-}
      - COSTCO_AU_PROXY_URL=${COSTCO_AU_PROXY_URL:-}
      - COSTCO_AU_PROXY_URLS=${COSTCO_AU_PROXY_URLS:-}
      - HEB_US_PROXY_URL=${HEB_US_PROXY_URL:-}
      - HEB_US_PROXY_URLS=${HEB_US_PROXY_URLS:-}
      - PROXY_ENDPOINTS=${PROXY_ENDPOINTS:-}
      - PROXY_HOST=${PROXY_HOST:-}
      - PROXY_PORT=${PROXY_PORT:-}
      - PROXY_USER=${PROXY_USER:-}
      - PROXY_PASS=${PROXY_PASS:-}
      - PROXY_SCHEME=${PROXY_SCHEME:-http}
      - COSTCO_AU_MIN_REQUEST_GAP_SEC=${COSTCO_AU_MIN_REQUEST_GAP_SEC:-20}
      - COSTCO_AU_LOCK_WAIT_SEC=${COSTCO_AU_LOCK_WAIT_SEC:-120}
    volumes:
      - catalog_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: always
    stop_grace_period: 60s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1536M
        reservations:
          memory: 384M

  celery_worker_light:
    <<: *backend-image
    command: >-
      celery -A core worker -l info
      -Q light
      --concurrency=${CELERY_LIGHT_CONCURRENCY:-2}
      --prefetch-multiplier=1 -O fair
    init: true
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - PG_CONN_MAX_AGE=${PG_CONN_MAX_AGE:-60}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DEBUG=False
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-0}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://${DOMAIN_NAME}}
      - FRONTEND_URL=${FRONTEND_URL:-https://${DOMAIN_NAME}}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - CATALOG_ALLOW_INLINE_STORE_WIDE_SCRAPE=${CATALOG_ALLOW_INLINE_STORE_WIDE_SCRAPE:-}
      - EBAY_HTTP_FIRST=${EBAY_HTTP_FIRST:-0}
      - PROXY_URL=${PROXY_URL:-}
      - PROXY_URLS=${PROXY_URLS:-}
      - COSTCO_AU_PROXY_URL=${COSTCO_AU_PROXY_URL:-}
      - COSTCO_AU_PROXY_URLS=${COSTCO_AU_PROXY_URLS:-}
      - HEB_US_PROXY_URL=${HEB_US_PROXY_URL:-}
      - HEB_US_PROXY_URLS=${HEB_US_PROXY_URLS:-}
      - PROXY_ENDPOINTS=${PROXY_ENDPOINTS:-}
      - PROXY_HOST=${PROXY_HOST:-}
      - PROXY_PORT=${PROXY_PORT:-}
      - PROXY_USER=${PROXY_USER:-}
      - PROXY_PASS=${PROXY_PASS:-}
      - PROXY_SCHEME=${PROXY_SCHEME:-http}
      - COSTCO_AU_MIN_REQUEST_GAP_SEC=${COSTCO_AU_MIN_REQUEST_GAP_SEC:-20}
      - COSTCO_AU_LOCK_WAIT_SEC=${COSTCO_AU_LOCK_WAIT_SEC:-120}
    volumes:
      - catalog_media:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: always
    stop_grace_period: 60s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1024M
        reservations:
          memory: 256M

  celery_beat:
    <<: *backend-image
    command: celery -A core beat -l info
    init: true
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - PG_CONN_MAX_AGE=${PG_CONN_MAX_AGE:-60}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DEBUG=False
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-0}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://${DOMAIN_NAME}}
      - FRONTEND_URL=${FRONTEND_URL:-https://${DOMAIN_NAME}}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - CATALOG_ALLOW_INLINE_STORE_WIDE_SCRAPE=${CATALOG_ALLOW_INLINE_STORE_WIDE_SCRAPE:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: always
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
        reservations:
          memory: 128M

volumes:
  pgdata:
  redisdata:
  catalog_media:
