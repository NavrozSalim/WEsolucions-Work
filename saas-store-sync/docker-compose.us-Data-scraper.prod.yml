# US scrape image — run on the US VPS only. Do not use docker-compose.yml for this host.
#
# Cloud VPS 6 (6 vCPU / 12 GB): catalog concurrency 3, discovery concurrency 1.
# DATABASE_URL and REDIS_URL must reach the main app.
#
#   docker compose -f docker-compose.us-Data-scraper.prod.yml --env-file .env.prod up -d --build

x-us-image: &us-image
  image: saas-store-sync-us-scraper
  build:
    context: ./backend
    dockerfile: Dockerfile
    args:
      # Real Google Chrome next to Chromium, for the eBay US Chrome setup mix.
      INSTALL_GOOGLE_CHROME: ${INSTALL_GOOGLE_CHROME:-1}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "4"

x-us-env: &us-env
  - DATABASE_URL=${DATABASE_URL}
  - REDIS_URL=${REDIS_URL}
  - USE_REDIS_CACHE=${USE_REDIS_CACHE:-1}
  - PG_CONN_MAX_AGE=${PG_CONN_MAX_AGE:-120}
  # Lanes are per store. Small batches let a store that starts later get a process sooner.
  - CATALOG_SCRAPE_CHUNK_SIZE=${CATALOG_SCRAPE_CHUNK_SIZE:-20}
  - CATALOG_SCRAPE_LANES=${CATALOG_SCRAPE_LANES:-2}
  - CATALOG_SCRAPE_STALL_MINUTES=${CATALOG_SCRAPE_STALL_MINUTES:-20}
  - JWT_SECRET=${JWT_SECRET}
  - ENCRYPTION_KEY=${ENCRYPTION_KEY}
  - ALLOWED_HOSTS=${ALLOWED_HOSTS}
  - DEBUG=False
  - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-0}
  - EBAY_HTTP_FIRST=${EBAY_HTTP_FIRST:-1}
  - PROXY_URL=${PROXY_URL:-}
  - PROXY_URLS=${PROXY_URLS:-}
  - PROXY_ENDPOINTS=${PROXY_ENDPOINTS:-}
  - PROXY_HOST=${PROXY_HOST:-}
  - PROXY_PORT=${PROXY_PORT:-}
  - PROXY_USER=${PROXY_USER:-}
  - PROXY_PASS=${PROXY_PASS:-}
  - PROXY_SCHEME=${PROXY_SCHEME:-http}
  # US static residential proxies. Amazon/eBay lists win; US_PROXY_URLS is the shared fallback.
  - US_PROXY_URLS=${US_PROXY_URLS:-}
  - AMAZON_US_PROXY_URLS=${AMAZON_US_PROXY_URLS:-}
  - AMAZON_US_DISABLE_PROXIES=${AMAZON_US_DISABLE_PROXIES:-}
  - AMAZON_US_MIN_REQUEST_GAP_SEC=${AMAZON_US_MIN_REQUEST_GAP_SEC:-2}
  - AMAZON_US_PROXY_BLOCK_COOLDOWN_SEC=${AMAZON_US_PROXY_BLOCK_COOLDOWN_SEC:-300}
  - AMAZON_US_SELENIUM_FALLBACK=${AMAZON_US_SELENIUM_FALLBACK:-1}
  - AMAZON_US_SELENIUM_WITH_PROXIES=${AMAZON_US_SELENIUM_WITH_PROXIES:-0}
  - EBAY_US_PROXY_URLS=${EBAY_US_PROXY_URLS:-}
  - EBAY_US_DISABLE_PROXIES=${EBAY_US_DISABLE_PROXIES:-}
  - EBAY_US_MIN_REQUEST_GAP_SEC=${EBAY_US_MIN_REQUEST_GAP_SEC:-3}
  - EBAY_US_HTTP_RETRIES=${EBAY_US_HTTP_RETRIES:-2}
  - EBAY_US_PROXY_BLOCK_COOLDOWN_SEC=${EBAY_US_PROXY_BLOCK_COOLDOWN_SEC:-300}
  - EBAY_US_FULL_ENGINE_SELENIUM=${EBAY_US_FULL_ENGINE_SELENIUM:-}
  # When this server uses the same eBay US proxies as the US Scraper, set this to 1
  # on both: proxy rest and use go through the shared Redis, so one server does
  # not keep using a proxy the other just rested.
  - EBAY_US_PROXY_SHARED=${EBAY_US_PROXY_SHARED:-0}
  - EBAY_US_PROXY_HOLD_SEC=${EBAY_US_PROXY_HOLD_SEC:-120}
  - EBAY_US_PROXY_MAX_WAIT_SEC=${EBAY_US_PROXY_MAX_WAIT_SEC:-240}
  # Chrome goes through the eBay US proxies; needs this server's IP on the proxy allowlist.
  - EBAY_US_BROWSER_PROXIES=${EBAY_US_BROWSER_PROXIES:-1}
  # eBay US Chrome, same switches as the US Scraper (see docker-compose.us-scraper.prod.yml).
  - EBAY_US_GOOGLE_CHROME=${EBAY_US_GOOGLE_CHROME:-0}
  - EBAY_US_PROFILE_PER_PROXY=${EBAY_US_PROFILE_PER_PROXY:-0}
  - EBAY_US_CHROME_MIX=${EBAY_US_CHROME_MIX:-}
  - EBAY_US_CHROME_MIX_ADAPTIVE=${EBAY_US_CHROME_MIX_ADAPTIVE:-0}
  - EBAY_US_CHROME_MIX_HOURS=${EBAY_US_CHROME_MIX_HOURS:-3}
  - EBAY_US_CHROME_MIX_EXPLORE=${EBAY_US_CHROME_MIX_EXPLORE:-0.1}
  # This server's tries are counted apart from the US Scraper's: different proxies.
  - EBAY_US_CHROME_MIX_GROUP=${EBAY_US_CHROME_MIX_GROUP:-discovery}
  # Discovery: Amazon product pages opened at once (1-16). Each takes its own
  # proxy; with a proxy list 6-8 is safe. A run of blocks drops to one at a time.
  - DISCOVERY_AMAZON_FETCH_WORKERS=${DISCOVERY_AMAZON_FETCH_WORKERS:-3}

services:
  celery_worker_us:
    <<: *us-image
    command: >-
      celery -A core worker -l info
      -Q heavy-us
      --concurrency=${CELERY_US_SCRAPER_CONCURRENCY:-3}
      --prefetch-multiplier=1
      --max-tasks-per-child=${CELERY_US_MAX_TASKS_PER_CHILD:-40}
      -n us-catalog@%h
      -O fair
    init: true
    environment: *us-env
    volumes:
      - catalog_media_us_scraper:/app/media
    restart: always
    stop_grace_period: 90s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 7G

  celery_discover_us:
    <<: *us-image
    command: >-
      celery -A core worker -l info
      -Q discover-us
      --concurrency=${CELERY_US_DISCOVER_CONCURRENCY:-1}
      --prefetch-multiplier=1
      -n discover-us@%h
      -O fair
    init: true
    environment: *us-env
    volumes:
      - catalog_media_us_scraper:/app/media
    restart: always
    stop_grace_period: 90s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 3G

volumes:
  catalog_media_us_scraper:
