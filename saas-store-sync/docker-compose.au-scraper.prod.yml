# Australia browser + AU feed worker — run on an AU-region VPS (e.g. Contabo AU).
#
# Consumes Celery queue ``heavy-au``: Amazon AU, eBay AU.
# Vevor AU feed ingest (``catalog.run_vevor_au_ingest``) runs on the main app's ``light`` worker.
# (Vevor AU XLSX feed). Same broker/DB as the main stack.
#
# Requirements:
# - Same backend image as main (build or pull BACKEND_IMAGE).
# - DATABASE_URL → your Postgres host (dedicated EU DB or main-published Postgres).
# - REDIS_URL → main application host Redis (Celery broker), e.g. redis://MAIN_IP:6379/0
#
# From saas-store-sync/:
#   docker compose -f docker-compose.au-scraper.prod.yml --env-file .env.prod up -d
#
# Env: copy secrets from `.env.prod` on the main server; set DATABASE_URL / REDIS_URL for
# reachability from this host. Match JWT_SECRET, ENCRYPTION_KEY, GOOGLE_*, proxies, etc.

x-backend-image: &backend-image
  image: ${BACKEND_IMAGE:-saas-store-sync-backend}
  build:
    context: ./backend
    dockerfile: Dockerfile

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "4"

services:
  celery_worker_au:
    <<: *backend-image
    command: >-
      celery -A core worker -l info
      -Q heavy-au
      --concurrency=${CELERY_AU_SCRAPER_CONCURRENCY:-2}
      --prefetch-multiplier=1 -O fair
    init: true
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - PG_CONN_MAX_AGE=${PG_CONN_MAX_AGE:-60}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DEBUG=False
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-0}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - EBAY_HTTP_FIRST=${EBAY_HTTP_FIRST:-1}
      - EBAY_HTTP_TIMEOUT_SEC=${EBAY_HTTP_TIMEOUT_SEC:-12}
      - EBAY_AU_HTTP_FIRST=${EBAY_AU_HTTP_FIRST:-}
      - EBAY_AU_FAST_SCRAPE=${EBAY_AU_FAST_SCRAPE:-1}
      - EBAY_AU_COOKIES_FILE=${EBAY_AU_COOKIES_FILE:-/app/secrets/ebay_au_cookies.json}
      - EBAY_AU_PAGE_WAIT_SEC=${EBAY_AU_PAGE_WAIT_SEC:-0.8}
      - EBAY_AU_PAGE_LOAD_TIMEOUT_SEC=${EBAY_AU_PAGE_LOAD_TIMEOUT_SEC:-12}
      - EBAY_AU_PAGE_WAIT_TIMEOUT_SEC=${EBAY_AU_PAGE_WAIT_TIMEOUT_SEC:-10}
      - EBAY_BIN_HYDRATE_MAX_SEC=${EBAY_BIN_HYDRATE_MAX_SEC:-2}
      - CATALOG_SCRAPE_CHUNK_SIZE=${CATALOG_SCRAPE_CHUNK_SIZE:-}
      - VEVOR_AU_FEED_URL=${VEVOR_AU_FEED_URL:-https://ads-feed.s3.us-west-2.amazonaws.com/ads/business/563/vevor-563.xlsx}
      - PROXY_URL=${PROXY_URL:-}
      - PROXY_URLS=${PROXY_URLS:-}
      - COSTCO_AU_PROXY_URL=${COSTCO_AU_PROXY_URL:-}
      - COSTCO_AU_PROXY_URLS=${COSTCO_AU_PROXY_URLS:-}
      - EBAY_AU_PROXY_URLS=${EBAY_AU_PROXY_URLS:-}
      # Safer eBay defaults (production logs showed eBay 403-cascading every IP):
      #   gap 5s lets a 5-proxy pool sustain ~1 request/sec/proxy without burning IPs
      #   retries 1 stops the worker thrashing the same blocked proxies
      #   cooldown 300s keeps a blocked IP off rotation long enough for eBay's WAF to forget it
      - EBAY_AU_MIN_REQUEST_GAP_SEC=${EBAY_AU_MIN_REQUEST_GAP_SEC:-5}
      - EBAY_AU_HTTP_RETRIES=${EBAY_AU_HTTP_RETRIES:-1}
      - EBAY_AU_PROXY_BLOCK_COOLDOWN_SEC=${EBAY_AU_PROXY_BLOCK_COOLDOWN_SEC:-300}
      - EBAY_AU_DISABLE_PROXIES=${EBAY_AU_DISABLE_PROXIES:-}
      - EBAY_AU_BAIL_ON_HTTP_BLOCK=${EBAY_AU_BAIL_ON_HTTP_BLOCK:-1}
      - EBAY_AU_FULL_ENGINE_ATTEMPTS=${EBAY_AU_FULL_ENGINE_ATTEMPTS:-1}
      - PROXY_ENDPOINTS=${PROXY_ENDPOINTS:-}
      - PROXY_HOST=${PROXY_HOST:-}
      - PROXY_PORT=${PROXY_PORT:-}
      - PROXY_USER=${PROXY_USER:-}
      - PROXY_PASS=${PROXY_PASS:-}
      - PROXY_SCHEME=${PROXY_SCHEME:-http}
      - ALIEXPRESS_APP_KEY=${ALIEXPRESS_APP_KEY:-}
      - ALIEXPRESS_APP_SECRET=${ALIEXPRESS_APP_SECRET:-}
      - ALIEXPRESS_TRACKING_ID=${ALIEXPRESS_TRACKING_ID:-}
      - ALIEXPRESS_DEFAULT_MARKET=${ALIEXPRESS_DEFAULT_MARKET:-UK}
      - ALIEXPRESS_SIGN_METHOD=${ALIEXPRESS_SIGN_METHOD:-md5}
      - ALIEXPRESS_API_URL=${ALIEXPRESS_API_URL:-https://api.taobao.com/router/rest}
      - ALIEXPRESS_IOP_GATEWAY=${ALIEXPRESS_IOP_GATEWAY:-https://api-sg.aliexpress.com}
      - ALIEXPRESS_OAUTH_REDIRECT_URI=${ALIEXPRESS_OAUTH_REDIRECT_URI:-}
      - ALIEXPRESS_ACCESS_TOKEN=${ALIEXPRESS_ACCESS_TOKEN:-}
      - ALIEXPRESS_REFRESH_TOKEN=${ALIEXPRESS_REFRESH_TOKEN:-}
      - COSTCO_AU_MIN_REQUEST_GAP_SEC=${COSTCO_AU_MIN_REQUEST_GAP_SEC:-20}
      - COSTCO_AU_LOCK_WAIT_SEC=${COSTCO_AU_LOCK_WAIT_SEC:-120}
      - COSTCO_AU_HTTP_RETRIES=${COSTCO_AU_HTTP_RETRIES:-2}
      - COSTCO_AU_HTTP_TIMEOUT_SEC=${COSTCO_AU_HTTP_TIMEOUT_SEC:-25}
      - COSTCO_AU_BLOCK_COOLDOWN_SEC=${COSTCO_AU_BLOCK_COOLDOWN_SEC:-600}
      - COSTCO_AU_SELENIUM_FALLBACK=${COSTCO_AU_SELENIUM_FALLBACK:-0}
    volumes:
      - catalog_media_au_worker:/app/media
      # Host dir must contain ebay_au_cookies.json (browser export for ebay.com.au). See .env.prod.example.
      - ${EBAY_AU_SECRETS_DIR:-./secrets}:/app/secrets:ro
    restart: always
    stop_grace_period: 60s
    logging: *default-logging

volumes:
  catalog_media_au_worker:
