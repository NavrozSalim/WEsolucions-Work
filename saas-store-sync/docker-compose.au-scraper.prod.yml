# Australia browser + AU feed worker — run on an AU-region VPS (e.g. Contabo AU).
#
# Consumes Celery queue ``heavy-au``: Amazon AU, eBay AU, and ``catalog.run_vevor_au_ingest``
# (Vevor AU XLSX feed). Same broker/DB as the main stack.
#
# Requirements:
# - Same backend image as main (build or pull BACKEND_IMAGE).
# - DATABASE_URL → your Postgres host (dedicated EU DB or main-published Postgres).
# - REDIS_URL → main application host Redis (Celery broker), e.g. redis://MAIN_IP:6379/0
#
# From saas-store-sync/:
#   docker compose -f docker-compose.au-scraper.prod.yml --env-file .env.prod up -d
#
# Env: copy secrets from `.env.prod` on the main server; set DATABASE_URL / REDIS_URL for
# reachability from this host. Match JWT_SECRET, ENCRYPTION_KEY, GOOGLE_*, proxies, etc.

x-backend-image: &backend-image
  image: ${BACKEND_IMAGE:-saas-store-sync-backend}
  build:
    context: ./backend
    dockerfile: Dockerfile

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "4"

services:
  celery_worker_au:
    <<: *backend-image
    command: >-
      celery -A core worker -l info
      -Q heavy-au
      --concurrency=${CELERY_AU_SCRAPER_CONCURRENCY:-2}
      --prefetch-multiplier=1 -O fair
    init: true
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DEBUG=False
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-0}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - EBAY_HTTP_FIRST=${EBAY_HTTP_FIRST:-0}
      - EBAY_AU_HTTP_FIRST=${EBAY_AU_HTTP_FIRST:-}
      - CATALOG_SCRAPE_CHUNK_SIZE=${CATALOG_SCRAPE_CHUNK_SIZE:-}
      - VEVOR_AU_FEED_URL=${VEVOR_AU_FEED_URL:-}
      - PROXY_URL=${PROXY_URL:-}
      - PROXY_URLS=${PROXY_URLS:-}
      - COSTCO_AU_PROXY_URL=${COSTCO_AU_PROXY_URL:-}
      - COSTCO_AU_PROXY_URLS=${COSTCO_AU_PROXY_URLS:-}
      - PROXY_ENDPOINTS=${PROXY_ENDPOINTS:-}
      - PROXY_HOST=${PROXY_HOST:-}
      - PROXY_PORT=${PROXY_PORT:-}
      - PROXY_USER=${PROXY_USER:-}
      - PROXY_PASS=${PROXY_PASS:-}
      - PROXY_SCHEME=${PROXY_SCHEME:-http}
      - COSTCO_AU_MIN_REQUEST_GAP_SEC=${COSTCO_AU_MIN_REQUEST_GAP_SEC:-20}
      - COSTCO_AU_LOCK_WAIT_SEC=${COSTCO_AU_LOCK_WAIT_SEC:-120}
    volumes:
      - catalog_media_au_worker:/app/media
    restart: always
    stop_grace_period: 60s
    logging: *default-logging

volumes:
  catalog_media_au_worker:
