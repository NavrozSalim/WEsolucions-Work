# US browser-scrape worker only — run on a US-region VPS (e.g. Contabo US).
# AU counterpart: docker-compose.au-scraper.prod.yml (-Q heavy-au).
#
# Consumes Celery queue ``heavy-us``: Amazon US, eBay US, HEB US (when proxies set).
#
# Requirements:
# - Same codebase image as main (build or pull BACKEND_IMAGE).
# - DATABASE_URL and REDIS_URL must reach the main stack (private network or TLS tunnel).
#
# From saas-store-sync/:
#   docker compose -f docker-compose.us-scraper.prod.yml --env-file .env.prod up -d
#
# Env: copy secrets from .env.prod on the main server; point DATABASE_URL / REDIS_URL at that stack.
# Default EBAY_HTTP_FIRST=1 (curl_cffi before Selenium). Set EBAY_HTTP_FIRST=0 in .env.prod to force browser-first.

x-backend-image: &backend-image
  image: ${BACKEND_IMAGE:-saas-store-sync-backend}
  build:
    context: ./backend
    dockerfile: Dockerfile

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "4"

services:
  celery_worker_us:
    <<: *backend-image
    command: >-
      celery -A core worker -l info
      -Q heavy-us
      --concurrency=${CELERY_US_SCRAPER_CONCURRENCY:-2}
      --prefetch-multiplier=1 -O fair
    init: true
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - PG_CONN_MAX_AGE=${PG_CONN_MAX_AGE:-60}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DEBUG=False
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-0}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - EBAY_HTTP_FIRST=${EBAY_HTTP_FIRST:-1}
      - PROXY_URL=${PROXY_URL:-}
      - PROXY_URLS=${PROXY_URLS:-}
      - PROXY_ENDPOINTS=${PROXY_ENDPOINTS:-}
      - PROXY_HOST=${PROXY_HOST:-}
      - PROXY_PORT=${PROXY_PORT:-}
      - PROXY_USER=${PROXY_USER:-}
      - PROXY_PASS=${PROXY_PASS:-}
      - PROXY_SCHEME=${PROXY_SCHEME:-http}
      - HEB_US_PROXY_URL=${HEB_US_PROXY_URL:-}
      - HEB_US_PROXY_URLS=${HEB_US_PROXY_URLS:-}
      - HEB_US_MIN_REQUEST_GAP_SEC=${HEB_US_MIN_REQUEST_GAP_SEC:-3}
      - HEB_HTTP_FIRST=${HEB_HTTP_FIRST:-1}
      - HEB_HTTP_TIMEOUT_SEC=${HEB_HTTP_TIMEOUT_SEC:-12}
      - HEB_HTTP_RETRIES=${HEB_HTTP_RETRIES:-1}
      - HEB_SELENIUM_FALLBACK=${HEB_SELENIUM_FALLBACK:-1}
      - HEB_SELENIUM_RETRIES=${HEB_SELENIUM_RETRIES:-2}
      - HEB_PAGE_TIMEOUT_SEC=${HEB_PAGE_TIMEOUT_SEC:-15}
      - HEB_HEADLESS=${HEB_HEADLESS:-1}
      - HEB_HOME_WARMUP=${HEB_HOME_WARMUP:-0}
      - HEB_USE_UNDETECTED=${HEB_USE_UNDETECTED:-0}
      - HEB_USE_APIFY=${HEB_USE_APIFY:-0}
      - HEB_COOKIES_FILE=${HEB_COOKIES_FILE:-}
    volumes:
      - catalog_media_us_worker:/app/media
    restart: always
    stop_grace_period: 60s
    logging: *default-logging

volumes:
  catalog_media_us_worker:
