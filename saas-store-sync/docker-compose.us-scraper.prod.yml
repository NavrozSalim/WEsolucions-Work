# US browser-scrape worker only — run on a US-region VPS (e.g. Contabo US).
# AU counterpart: docker-compose.au-scraper.prod.yml (-Q heavy-au and -Q feed-au).
#
# Consumes Celery queue ``heavy-us``: Amazon US, eBay US.
# HEB is handled by a separate Windows desktop runner, not this worker.
#
# Tuned for Cloud VPS 30 (8 vCPU / 24 GB): concurrency 6 + chunk size 80 gives
# up to 6 parallel scrape sessions per store without oversaturating Amazon/eBay.
# Set CATALOG_SCRAPE_CHUNK_SIZE on this host too — chunk tasks are split here.
#
# Requirements:
# - Same codebase image as main (build or pull BACKEND_IMAGE).
# - DATABASE_URL and REDIS_URL must reach the main stack (private network or TLS tunnel).
#
# From saas-store-sync/:
#   docker compose -f docker-compose.us-scraper.prod.yml --env-file .env.prod up -d
#
# Env: copy secrets from .env.prod on the main server; point DATABASE_URL / REDIS_URL at that stack.
# Default EBAY_HTTP_FIRST=1 (curl_cffi before Selenium). Set EBAY_HTTP_FIRST=0 in .env.prod to force browser-first.

x-backend-image: &backend-image
  image: ${BACKEND_IMAGE:-saas-store-sync-backend}
  build:
    context: ./backend
    dockerfile: Dockerfile

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "4"

services:
  celery_worker_us:
    <<: *backend-image
    command: >-
      celery -A core worker -l info
      -Q heavy-us
      --concurrency=${CELERY_US_SCRAPER_CONCURRENCY:-6}
      --prefetch-multiplier=1
      --max-tasks-per-child=${CELERY_US_MAX_TASKS_PER_CHILD:-40}
      -O fair
    init: true
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - USE_REDIS_CACHE=${USE_REDIS_CACHE:-1}
      - PG_CONN_MAX_AGE=${PG_CONN_MAX_AGE:-120}
      # Lanes are per store. Two stores at 3 lanes share the 6 worker processes;
      # small batches let a store that starts later get a process within minutes.
      - CATALOG_SCRAPE_CHUNK_SIZE=${CATALOG_SCRAPE_CHUNK_SIZE:-20}
      - CATALOG_SCRAPE_LANES=${CATALOG_SCRAPE_LANES:-3}
      - CATALOG_SCRAPE_STALL_MINUTES=${CATALOG_SCRAPE_STALL_MINUTES:-20}
      - JWT_SECRET=${JWT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS}
      - DEBUG=False
      - SECURE_SSL_REDIRECT=${SECURE_SSL_REDIRECT:-0}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - FRONTEND_URL=${FRONTEND_URL:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - EBAY_HTTP_FIRST=${EBAY_HTTP_FIRST:-1}
      - PROXY_URL=${PROXY_URL:-}
      - PROXY_URLS=${PROXY_URLS:-}
      - PROXY_ENDPOINTS=${PROXY_ENDPOINTS:-}
      - PROXY_HOST=${PROXY_HOST:-}
      - PROXY_PORT=${PROXY_PORT:-}
      - PROXY_USER=${PROXY_USER:-}
      - PROXY_PASS=${PROXY_PASS:-}
      - PROXY_SCHEME=${PROXY_SCHEME:-http}
      # US static residential proxies. Amazon/eBay lists win; US_PROXY_URLS is the shared fallback.
      - US_PROXY_URLS=${US_PROXY_URLS:-}
      - AMAZON_US_PROXY_URLS=${AMAZON_US_PROXY_URLS:-}
      - AMAZON_US_DISABLE_PROXIES=${AMAZON_US_DISABLE_PROXIES:-}
      - AMAZON_US_MIN_REQUEST_GAP_SEC=${AMAZON_US_MIN_REQUEST_GAP_SEC:-2}
      - AMAZON_US_PROXY_BLOCK_COOLDOWN_SEC=${AMAZON_US_PROXY_BLOCK_COOLDOWN_SEC:-300}
      - AMAZON_US_SELENIUM_FALLBACK=${AMAZON_US_SELENIUM_FALLBACK:-1}
      - AMAZON_US_SELENIUM_WITH_PROXIES=${AMAZON_US_SELENIUM_WITH_PROXIES:-0}
      - EBAY_US_PROXY_URLS=${EBAY_US_PROXY_URLS:-}
      - EBAY_US_DISABLE_PROXIES=${EBAY_US_DISABLE_PROXIES:-}
      - EBAY_US_MIN_REQUEST_GAP_SEC=${EBAY_US_MIN_REQUEST_GAP_SEC:-3}
      - EBAY_US_HTTP_RETRIES=${EBAY_US_HTTP_RETRIES:-2}
      - EBAY_US_PROXY_BLOCK_COOLDOWN_SEC=${EBAY_US_PROXY_BLOCK_COOLDOWN_SEC:-300}
      - EBAY_US_FULL_ENGINE_SELENIUM=${EBAY_US_FULL_ENGINE_SELENIUM:-}
      # eBay's bot wall refuses plain HTTP, so eBay US loads pages in Chrome.
      - EBAY_US_BROWSER_FIRST=${EBAY_US_BROWSER_FIRST:-1}
      # Chrome uses the eBay US proxies. Needs this server's IP on the Webshare
      # IP allowlist (Chrome cannot send a proxy password). 0 = server's own IP.
      - EBAY_US_BROWSER_PROXIES=${EBAY_US_BROWSER_PROXIES:-1}
      # Optional: cookies exported from a real browser (not logged in), same format as AU.
      # ebay_ca_cookies.json in the same folder is loaded too.
      - EBAY_US_COOKIES_FILE=${EBAY_US_COOKIES_FILE:-/app/secrets/ebay_us_cookies.json}
      # 1 = try the item on ebay.ca before ebay.com (helps only on the server's own IP).
      - EBAY_US_CA_FIRST=${EBAY_US_CA_FIRST:-0}
      # After Chrome on the server's own IP, one plain request with Chrome's cookies.
      - EBAY_US_COOKIE_HANDOFF=${EBAY_US_COOKIE_HANDOFF:-1}
      # 1 = Chrome keeps its own Linux browser name instead of a random Windows one.
      - EBAY_US_CHROME_NATIVE_UA=${EBAY_US_CHROME_NATIVE_UA:-0}
      # 1 = windowed Chrome on a virtual screen (Xvfb); 0 = headless.
      - EBAY_US_CHROME_HEADFUL=${EBAY_US_CHROME_HEADFUL:-1}
      - ALIEXPRESS_APP_KEY=${ALIEXPRESS_APP_KEY:-}
      - ALIEXPRESS_APP_SECRET=${ALIEXPRESS_APP_SECRET:-}
      - ALIEXPRESS_TRACKING_ID=${ALIEXPRESS_TRACKING_ID:-}
      - ALIEXPRESS_DEFAULT_MARKET=${ALIEXPRESS_DEFAULT_MARKET:-UK}
      - ALIEXPRESS_SIGN_METHOD=${ALIEXPRESS_SIGN_METHOD:-md5}
      - ALIEXPRESS_API_URL=${ALIEXPRESS_API_URL:-https://api.taobao.com/router/rest}
      - ALIEXPRESS_IOP_GATEWAY=${ALIEXPRESS_IOP_GATEWAY:-https://api-sg.aliexpress.com}
      - ALIEXPRESS_OAUTH_REDIRECT_URI=${ALIEXPRESS_OAUTH_REDIRECT_URI:-}
      - ALIEXPRESS_ACCESS_TOKEN=${ALIEXPRESS_ACCESS_TOKEN:-}
      - ALIEXPRESS_REFRESH_TOKEN=${ALIEXPRESS_REFRESH_TOKEN:-}
    volumes:
      - catalog_media_us_worker:/app/media
      - ${EBAY_US_SECRETS_DIR:-./secrets}:/app/secrets:ro
    restart: always
    stop_grace_period: 90s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "7.5"
          memory: 20G
        reservations:
          memory: 4G

volumes:
  catalog_media_us_worker:
